# MAD Protocol, served as static files at pixeldodge.com.
# Installed by scripts/deploy.sh. TLS is added afterwards by certbot (--nginx),
# which rewrites this file in place with the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name pixeldodge.com www.pixeldodge.com;

    root /var/www/pixeldodge.com;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The page itself is revalidated on every visit so a new build shows up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Engine and fonts only change when a build renames or replaces them.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
